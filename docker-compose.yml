# 边缘层：nginx（443 SNI 分流 + 所有 HTTPS 站点）+ Xray（VLESS/REALITY/Vision）
# 两者都用 host 网络：不经过 Docker NAT，真实 IP / IPv6 不丢失
# 公网入站由 VPS 安全组控制：只放行 SSH 和 443/tcp
# 业务服务和伪装站应用用各自的 compose 单独部署，端口只绑定 127.0.0.1
# nginx 日志写到宿主机 logs/nginx/（升级、重建容器都不丢），由 logrotate 每天轮转、保留 14 天
# Xray 日志走 docker logs xray

name: edge

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: ${NGINX_IMAGE:-nginx:stable-alpine}
    container_name: nginx
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
    logging: *default-logging

  xray:
    # 官方镜像（distroless，以 UID 65532 非 root 运行，入口即 xray）
    # 不挂到镜像自带的 /usr/local/etc/xray/（那是 -confdir 多文件目录），单独挂一个文件并用 -c 指定
    image: ${XRAY_IMAGE:-ghcr.io/xtls/xray-core:latest}
    container_name: xray
    network_mode: host
    restart: unless-stopped
    command: ["run", "-c", "/etc/xray/config.json"]
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro
    logging: *default-logging
