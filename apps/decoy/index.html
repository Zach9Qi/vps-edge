<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fafaf8">
  <meta name="description" content="FORMA 01 人形机器人概念设计，探索感知、动作与人的距离。">
  <title>FORMA Robotics · FORMA 01</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="gallery.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">跳至正文</a>
  <header class="mast">
    <nav class="wrap nav" aria-label="主导航">
      <a class="brand" href="#overview" aria-label="FORMA Robotics 首页"><img src="assets/mark.svg" alt="" width="32" height="32"><span>FORMA</span><small>ROBOTICS</small></a>
      <div class="nav-links"><a href="#overview">概览</a><a href="#design">设计细节</a><a href="#interaction">交互构想</a></div>
    </nav>
  </header>
  <main id="main">
    <section class="hero" id="overview" aria-labelledby="hero-title">
      <img class="hero-img" src="assets/portrait.jpg" width="1672" height="941" fetchpriority="high" alt="FORMA 01 的银白色头部与上半身，黑色弧面面罩下露出颈部机械结构">
      <div class="hero-shade"></div>
      <div class="hero-inner wrap">
        <div class="hero-copy">
          <p class="kicker"><i></i>FORMA 01</p>
          <h1 id="hero-title">智能，<br>初具人形<span>。</span></h1>
          <p class="lead">一款关于目光、触碰与动作的<br>人形机器人概念设计。</p>
          <a class="button" href="#design">探索设计</a>
          <button type="button" class="gallery-link" data-open-view="optic" hidden>打开细节图册</button>
        </div>
        <div class="hero-foot"><span>HUMANOID ROBOT</span><span>整机视图</span></div>
      </div>
    </section>
    <section id="design" class="design wrap" aria-labelledby="design-title">
      <p class="section-label"><i></i>INDUSTRIAL DESIGN</p>
      <div class="section-heading"><h2 id="design-title">近看，才见细节。</h2><p>从连续的外壳曲面，到关节间的留白。</p></div>
      <div class="studies">
        <figure class="study"><div class="detail optic" data-view="optic" data-name="弧面面罩"><img src="assets/portrait.jpg" loading="lazy" alt="烟色面罩与银白头壳的曲面衔接"><button type="button" class="inspect" data-open-view="optic" aria-label="放大查看弧面面罩" hidden></button></div>
          <figcaption><span class="english">OPTICS</span><h3>一道弧面，收拢目光。</h3><p>深色面罩沿头部轮廓延伸，将视觉元件藏进一片连续的反光里。</p></figcaption>
        </figure>
        <figure class="study"><div class="detail joint" data-view="joint" data-name="颈肩关节"><img src="assets/portrait.jpg" loading="lazy" alt="颈部连杆与肩部的金属转轴"><button type="button" class="inspect" data-open-view="joint" aria-label="放大查看颈肩关节" hidden></button></div>
          <figcaption><span class="english">ARTICULATION</span><h3>让转动的结构可见。</h3><p>颈部连杆与肩轴之间保留间隙，露出壳体之下彼此咬合的机械层次。</p></figcaption>
        </figure>
      </div>
    </section>
    <section id="interaction" class="interaction" aria-labelledby="interaction-title">
      <div class="wrap">
        <p class="section-label"><i></i>PHYSICAL INTERACTION</p>
        <h2 id="interaction-title">从一次轻触开始。</h2>
        <p class="interaction-copy">设想桌上有一颗小球。手指缓缓靠近，在相对的两个点合拢，<br class="wide-only">把它从桌面轻轻托起。</p>
        <figure class="touch"><div class="touch-photo" data-view="hand" data-name="指尖抓取"><img src="assets/touch.jpg" width="1672" height="941" loading="lazy" alt="分节的金属手指轻轻捏住一颗橙色小球"><button type="button" class="inspect" data-open-view="hand" aria-label="放大查看指尖抓取" hidden></button></div><figcaption>FORMA 01 <span>/</span> 指尖抓取构想</figcaption></figure>
      </div>
    </section>
  </main>
  <footer><div class="wrap footer"><a class="brand" href="#overview"><img src="assets/mark.svg" alt="" width="28" height="28"><span>FORMA</span></a><p>机器人概念设计</p><a href="#overview">返回顶部</a></div></footer>
  <dialog class="gallery" aria-labelledby="gallery-title">
    <header class="gallery-bar"><h2 id="gallery-title">FORMA 01 <span>/ 细节图册</span></h2><form method="dialog"><button class="gallery-close" aria-label="关闭图册" autofocus>×</button></form></header>
    <div class="gallery-frame"><div class="gallery-crop"><img class="gallery-photo" alt=""></div></div>
    <div class="gallery-bar gallery-controls">
      <p class="gallery-caption" aria-live="polite" aria-atomic="true"></p>
      <div class="gallery-actions">
        <button type="button" id="previous">上一张</button>
        <button type="button" id="zoom" aria-label="放大细节" aria-pressed="false">放大</button>
        <button type="button" id="next">下一张</button>
      </div>
    </div>
  </dialog>
</body>
</html>
