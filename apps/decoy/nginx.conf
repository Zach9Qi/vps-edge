# 伪装站容器内的 nginx 配置（所有主题共用）
# 外层 nginx 负责 HTTPS 和安全响应头，这里只管静态文件
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain application/xml;

    # 干净的网址：/pricing 对应 pricing.html，/journal/xxx 对应 journal/xxx.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
