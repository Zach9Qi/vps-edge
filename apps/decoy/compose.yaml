# 伪装站应用：由 edge 自动构建、启动（edge install / apply / up / update / theme），不用手动运行
# 端口 APP_PORT 由 edge 传入（来自 .env 的 DECOY_PORT），只绑定 127.0.0.1
# 主题 DECOY_THEME 来自 .env，对应 themes/ 下的目录名；改了会自动重新构建
services:
  web:
    build:
      context: .
      args:
        THEME: ${DECOY_THEME:-forma}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:?端口由 edge 传入，请用 edge apply 或 edge up decoy 启动}:80"
